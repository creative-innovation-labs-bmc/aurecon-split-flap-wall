name: Apply random-office v2

on:
  push:
    paths:
      - "tools/apply_random_v2.py"
      - ".github/workflows/apply-random-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-random-v2
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply random v2 patch
        run: python tools/apply_random_v2.py
      - name: Validate JavaScript syntax
        run: node --check wall-live.js
      - name: Commit production files
        shell: bash
        run: |
          if git diff --quiet -- wall-live.js 49x7-random.html; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wall-live.js 49x7-random.html
          git commit -m "Fix random office launch and keep clock live [skip ci]"
          git pull --rebase origin main
          git push
