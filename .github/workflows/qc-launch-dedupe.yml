name: QC launch clock dedupe

on:
  push:
    paths:
      - "launch-clock-dedupe.js"
      - "49x7-random.html"
      - "tools/qc_launch_dedupe.mjs"
      - ".github/workflows/qc-launch-dedupe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qc-launch-clock-dedupe
  cancel-in-progress: true

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Chromium test runtime
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/split-flap-qc-server.log 2>&1 &
          sleep 2
      - name: Run launch dedupe QC
        run: node tools/qc_launch_dedupe.mjs
      - name: Commit QC report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qc/launch-dedupe-report.json qc/launch-dedupe-frame.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add launch clock dedupe QC results [skip ci]"
          git push
