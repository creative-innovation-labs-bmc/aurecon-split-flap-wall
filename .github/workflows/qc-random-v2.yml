name: QC random-office v2

on:
  push:
    paths:
      - "tools/qc_random_v2.mjs"
      - ".github/workflows/qc-random-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qc-random-v2
  cancel-in-progress: true

jobs:
  browser-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/random-qc-server.log 2>&1 &
          sleep 2
      - name: Run browser QC
        run: node tools/qc_random_v2.mjs
      - name: Commit QC report and captures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qc/random-v2-report.json qc/random-v2-launch.png qc/random-v2-complete.png
          git commit -m "Add random-office v2 browser QC results [skip ci]"
          git pull --rebase origin main
          git push
