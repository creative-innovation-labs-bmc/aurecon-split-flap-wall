name: Update BOM weather

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-weather.yml"
      - "scripts/fetch_weather.py"

permissions:
  contents: write

concurrency:
  group: bom-weather-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Melbourne Olympic Park observation
        run: python scripts/fetch_weather.py
      - name: Commit changed weather data
        run: |
          if git diff --quiet -- weather.json; then
            echo "No weather change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git commit -m "Update BOM weather [skip ci]"
          git push
