name: Apply final split-flap QC

on:
  push:
    paths:
      - "tools/apply_final_qc_patch.py"
      - ".github/workflows/apply-final-qc.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-split-flap-qc
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply tested production patch
        run: python tools/apply_final_qc_patch.py
      - name: Validate JavaScript and indexing controls
        run: |
          node --check wall-live.js
          grep -q 'Content-Security-Policy' 49x7.html
          grep -q 'noindex' 49x7.html
          grep -q 'Disallow: /' robots.txt
      - name: Commit production files
        run: |
          if git diff --quiet -- 49x7.html 49x7-live.html wall-live.js wall-live.css README.md; then
            echo "No production changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 49x7.html 49x7-live.html wall-live.js wall-live.css README.md
          git commit -m "Final QC: alignment, security and Shield performance [skip ci]"
          git push
