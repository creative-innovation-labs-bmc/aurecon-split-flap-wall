name: Apply short office-name alignment

on:
  push:
    paths:
      - "tools/apply_short_name_alignment.py"
      - ".github/workflows/apply-short-name-alignment.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply alignment patch
        run: python tools/apply_short_name_alignment.py
      - name: Commit production files
        run: |
          if git diff --quiet -- wall-live.js 49x7.html 49x7-live.html README.md; then
            echo "No production changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wall-live.js 49x7.html 49x7-live.html README.md
          git commit -m "Align five and six letter office names [skip ci]"
          git push
