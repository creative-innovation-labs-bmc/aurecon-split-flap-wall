name: Apply airport sequence patch

on:
  push:
    paths:
      - "tools/apply_airport_sequence_patch.py"
      - ".github/workflows/apply-airport-sequence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python tools/apply_airport_sequence_patch.py
      - name: Validate JavaScript
        run: node --check wall-live.js
      - name: Commit production files
        run: |
          if git diff --quiet -- wall-live.js wall-live.css 49x7.html 49x7-live.html README.md; then
            echo "No production changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wall-live.js wall-live.css 49x7.html 49x7-live.html README.md
          git commit -m "Fix airport sequencing and flap readability [skip ci]"
          git push
